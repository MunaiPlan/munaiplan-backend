name: CI
on:
  push:
    branches: [main, "recovery/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Deploy scripts parse
        run: for f in deploy/*.sh; do sh -n "$f"; done
      - name: Production image builds
        run: docker build -t munaiplan-api:ci .
